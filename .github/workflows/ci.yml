name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['16.8.0', '16.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn workspace overlay-kit build
      - name: Test the packed CJS and ESM entry points
        run: |
          yarn workspace overlay-kit pack --out "$RUNNER_TEMP/overlay-kit.tgz"
          test_dir=$(mktemp -d)
          cp .github/scripts/react-compat.mjs "$test_dir/"
          cd "$test_dir"
          printf '%s\n' '{"private": true}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/overlay-kit.tgz" react@${{ matrix.react }} react-dom@${{ matrix.react }} esbuild@0.24.0
          node react-compat.mjs

  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          [
            'yarn workspace overlay-kit run test',
            'yarn workspace overlay-kit run test:attw',
            'yarn workspace overlay-kit run test:publint',
            'yarn lint',
            'yarn workspace @overlay-kit/framer-motion-react-16 run build',
            'yarn workspace @overlay-kit/framer-motion-react-17 run build',
            'yarn workspace @overlay-kit/framer-motion-react-18 run build',
            'yarn workspace @overlay-kit/framer-motion-react-19 run build',
          ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Build Package
        run: yarn workspace overlay-kit run build

      - name: Run command
        run: ${{ matrix.command }}
      - if: matrix.command == 'yarn workspace overlay-kit run test'
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
